[project]
name = "pharma-ai-ecosystem"
version = "0.1.0"
description = "Single-user Slack pharmaceutical multi-agent orchestration platform (PRD v3.0)"
requires-python = ">=3.12"
# Dependency set per PRD s26.2. Deliberately EXCLUDES fastapi, slack-bolt, and the
# openai/anthropic SDKs: v3 reaches both providers through the OpenClaw gateway
# over HTTP, and FastAPI is explicitly not a v3 core dependency (s1, s41.1).
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0.2",
    "langchain-core>=0.3.15",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "greenlet>=3.1",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
    "python-docx>=1.1",
    "jinja2>=3.1",
    "markdown>=3.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
